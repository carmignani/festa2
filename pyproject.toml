[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "festa2"
version = "0.1.0"
description = "Fast Electron Spin Tracking based on AT and Xsuite"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "accelerator-toolbox",
    "xtrack",
    "xpart",
]

[tool.setuptools.packages.find]
where = ["src"]